<p class="p1"><span class="s1">수백 개의 핸드메이드 크로셰 플라워 모티프를 레이어링하여 완성한 미니 드레스입니다. 다양한 크기와 컬러의 꽃들이 유기적으로 연결되어 하나의 살아있는 정원을 연상시키며, 입체적인 텍스처가 독보적인 존재감을 선사합니다. 슬림한 실루엣과 풍성한 플라워 디테일의 대비가 로맨틱하면서도 아방가르드한 무드를 연출합니다.</span></p>
